<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Daemon</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/panels.css">
</head>
<body>
    <div id="app-container">

        <!-- header and nav bar -->

        <header class="nav-bar">
            <div class="project-logo">
                <svg class="logo-svg" viewBox="0 0 24 24"><path d="M12 2C8 6 5 10 5 14a7 7 0 0 0 14 0c0-4-3-8-7-12z"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
                <span class="project-title">OIL SPILL DETECTION</span>
            </div>
            <nav class="nav-links">
                <button class="nav-item active" data-view="view-dashboard" id="nav-dashboard">
                <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
                </button>
                <button class="nav-item " data-view="view-incidents" id="nav-incidents">
                <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                Incidents Archive
                </button>
                <button class="nav-item " data-view="view-report" id="nav-report">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                Forensic Report
                </button>
                <button class="nav-item" data-view="view-about" id="nav-about">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                System Info
                </button>
            </nav>
        

        </header>

        <main id="view-dashboard" class="app-view active">
            <div class="dashboard-layout">

                <div class="map-container-wrapper">
                    <div class="map-layer-control">
                        <div class="layer-control-title">Overlays</div>
                        
                        <label class="layer-toggle-item">
                        <input type="checkbox" id="toggle-spill" checked>
                        <span class="layer-color-indicator color-spill"></span>
                        <span>Spill area</span>
                        </label>

                        
                        <label class="layer-toggle-item">
                        <input type="checkbox" id="toggle-origin" checked>
                        <span class="layer-color-indicator color-origin"></span>
                        <span>Origin</span>
                        </label>
                        
                        <label class="layer-toggle-item">
                        <input type="checkbox" id="toggle-drift" checked>
                        <span class="layer-color-indicator color-drift"></span>
                        <span>Drift path</span>
                        </label>
                        

                        <label class="layer-toggle-item">
                        <input type="checkbox" id="toggle-vessels" checked>
                        <span class="layer-color-indicator color-vessels"></span>
                        <span>Vessel tracks</span>
                        </label>
                    </div>

                    <div id="map"></div>

                        
                </div>

                <aside class="sidebar-panel">

                    <div class="sidebar-scrollable">

                        <section class="panel-box">
                            <div class="panel-header">
                                <span class="panel-title">Incident Metadata</span>
                            </div>
                            <div class="panel-body">
                                
                                <div id="incident-summary-rows" class="data-table-rows">
                                
                                </div>
                            </div>
                        </section>



                        <section class="panel-box">
                            <div class="panel-header">
                                <span class="panel-title">Candidate Vessels</span>
                            </div>
                            <div class="panel-body">
                                
                                <div id="vessel-candidate-list" class="vessel-list">
                                
                                </div>
                            </div>
                        </section>

                        <div class="footer-box" >
                        <div class="panel-body" style="padding: 8px 12px;">
                            <div id="last-updated" class="data-row" style="border: none; padding: 0; justify-content: flex-start; gap: 8px;">
                            <span class="data-label" style="font-size: 11px;">LAST UPDATED</span>
                            <span class="data-value font-mono" style="font-size: 11px;"></span>
                            </div>
                        </div>
                        </div>
                    </div>
                </aside>


            </div>
        </main>








    </div>




    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  

  <script type="module" src="js/app.js"></script>
</body>
</html>
